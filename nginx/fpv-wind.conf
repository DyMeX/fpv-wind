# FPV Wind: static app + caching proxy to Open-Meteo.
# Include inside the server{} block of your site (for example: include /etc/nginx/snippets/fpv-wind.conf;).
# The app is served under /fpv-wind/. To use another path, replace every /fpv-wind/ below and copy the files to
# the matching directory below "root". The app itself uses relative URLs and needs no change; to serve it at the web
# root, use "location /" blocks and set "root" to the directory with the files.
# Requires fpv-wind-cache.conf in the http{} context. Replace example.com in your server_name directive as needed.
#
# Optional security headers (adjust to your policy):
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The app loads only same-origin scripts and styles, plus map tiles from tile.opentopomap.org and place search from
# nominatim.openstreetmap.org, so a Content-Security-Policy must allow img-src for the tiles and connect-src for Nominatim.
# Note: add_header in a nested location replaces the headers inherited from the parent, so repeat them where needed.

location = /fpv-wind { return 301 /fpv-wind/; }

# Forecast proxy: /fpv-wind/api/forecast?... -> https://api.open-meteo.com/v1/forecast?... (GET only, cached 30 minutes).
# config.js points the app at "api/forecast" relative to the app directory, which resolves to this location.
location ^~ /fpv-wind/api/forecast {
  limit_except GET { deny all; }
  limit_req zone=fpv_wind_api burst=200 nodelay;    # the wind map requests many points at once (up to 144)
  limit_req_status 429;
  proxy_pass https://api.open-meteo.com/v1/forecast;
  proxy_set_header Host api.open-meteo.com;
  proxy_set_header Cookie "";
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;                         # chain with an intermediate certificate (default depth 1 gives 502)
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;   # CA bundle path on Debian/Ubuntu; differs on other systems
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
  proxy_cache fpv_wind;
  proxy_cache_key $args;
  proxy_cache_valid 200 30m;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
  proxy_ignore_headers Cache-Control Expires Set-Cookie;
  proxy_hide_header Set-Cookie;
  add_header X-Cache-Status $upstream_cache_status always;
  add_header Cache-Control "no-store" always;
}

# App files. The service worker, manifest, config and index are never cached so updates apply immediately;
# app.js and app.css are versioned with ?v= in index.html.
location ^~ /fpv-wind/ {
  root /var/www;                                    # files live in /var/www/fpv-wind/
  location ~ ^/fpv-wind/(sw\.js|manifest\.json|config\.js|index\.html)?$ {
    root /var/www;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri /fpv-wind/index.html;
  }
  location ^~ /fpv-wind/vendor/ {                   # Leaflet 1.9.4 (the directory name does not change between versions)
    root /var/www;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  try_files $uri $uri/ /fpv-wind/index.html;
}
