# FPV Wind: response cache for the Open-Meteo proxy and a per-client rate limit.
# Include this file in the http{} context (for example /etc/nginx/conf.d/fpv-wind-cache.conf).
# All clients reach Open-Meteo from the server's IP address. The cache and the rate limit protect the free quota of the
# upstream API (limits at the time of writing, per the Open-Meteo documentation: 600 requests/min, 5000/hour, 10000/day;
# check the current terms before deploying).
# The cache directory must exist and be writable by the nginx worker user: install -d -o www-data /var/cache/nginx/fpv-wind
proxy_cache_path /var/cache/nginx/fpv-wind levels=1:2 keys_zone=fpv_wind:10m max_size=200m inactive=6h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=fpv_wind_api:1m rate=10r/s;
